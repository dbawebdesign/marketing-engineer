<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Host app with Marketing Engineer embedded</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    header { padding: 16px 24px; background: #0f172a; color: #fff; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    #me { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
    #log { font: 12px ui-monospace, monospace; white-space: pre-wrap; color: #475569; }
  </style>
</head>
<body>
  <header>Acme Field Ops · Growth</header>
  <main>
    <div id="me"></div>
    <p id="log"></p>
  </main>

  <!-- Point these at your Marketing Engineer deployment. -->
  <script src="http://localhost:3100/embed/v1.js"></script>
  <script>
    const ME_URL = "http://localhost:3100";
    const log = (s) => (document.getElementById("log").textContent += s + "\n");

    async function start() {
      // Your backend mints a fresh, single-use token for the signed-in user.
      const { token } = await fetch("/token", { credentials: "same-origin" }).then((r) => r.json());
      const handle = MarketingEngineer.mount("#me", {
        baseUrl: ME_URL,
        token,
        path: "/",
        theme: "auto",
        onEvent: (e) => log(`event: ${e.name} ${JSON.stringify(e.data)}`),
        onResize: (h) => log(`resized to ${h}px`),
      });
      window.meHandle = handle; // handle.unmount() removes it
    }
    start().catch((e) => log("failed: " + e.message));
  </script>
</body>
</html>
